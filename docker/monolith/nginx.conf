# =============================================================================
# Nginx monolithe - gateway + reverse proxy vers les services PHP locaux
# /api/v1/<domaine>/* -> 127.0.0.1:<port>
# /*                  -> frontend Inertia (127.0.0.1:3000)
# =============================================================================

upstream web_app       { server 127.0.0.1:3000; }
upstream auth_svc      { server 127.0.0.1:8001; }
upstream organisation_svc { server 127.0.0.1:8002; }
upstream asset_svc     { server 127.0.0.1:8003; }
upstream movement_svc  { server 127.0.0.1:8004; }
upstream inventory_svc { server 127.0.0.1:8005; }
upstream maintenance_svc { server 127.0.0.1:8006; }
upstream valuation_svc { server 127.0.0.1:8007; }
upstream document_svc  { server 127.0.0.1:8008; }
upstream notification_svc { server 127.0.0.1:8009; }
upstream reporting_svc { server 127.0.0.1:8010; }

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 20m;

    # --- Endpoints sensibles : rate-limit strict -------------------------------
    location ~ ^/api/v1/auth/(login|register|refresh|forgot-password|reset-password|verify) {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://auth_svc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # --- Auth / users / roles ---------------------------------------------------
    location /api/v1/auth/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://auth_svc;
        include /etc/nginx/proxy_params.inc;
    }
    location ~ ^/api/v1/(users|roles|permissions)(/|\?|$) {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://auth_svc;
        include /etc/nginx/proxy_params.inc;
    }

    # --- Organisation (alias /organisation et /org) -----------------------------
    location /api/v1/organisation/ {
        limit_req zone=api_limit burst=40 nodelay;
        rewrite ^/api/v1/organisation/(.+)$ /api/v1/$1 break;
        proxy_pass http://organisation_svc;
        include /etc/nginx/proxy_params.inc;
    }
    location /api/v1/org/ {
        limit_req zone=api_limit burst=40 nodelay;
        rewrite ^/api/v1/org/(.+)$ /api/v1/$1 break;
        proxy_pass http://organisation_svc;
        include /etc/nginx/proxy_params.inc;
    }

    # --- Metier -----------------------------------------------------------------
    location /api/v1/assets        { limit_req zone=api_limit burst=40 nodelay; proxy_pass http://asset_svc;       include /etc/nginx/proxy_params.inc; }
    location /api/v1/movements     { limit_req zone=api_limit burst=40 nodelay; proxy_pass http://movement_svc;    include /etc/nginx/proxy_params.inc; }
    location /api/v1/inventories   { limit_req zone=api_limit burst=40 nodelay; proxy_pass http://inventory_svc;   include /etc/nginx/proxy_params.inc; }
    location /api/v1/maintenance   { limit_req zone=api_limit burst=40 nodelay; proxy_pass http://maintenance_svc; include /etc/nginx/proxy_params.inc; }
    location /api/v1/valorisation  { limit_req zone=api_limit burst=40 nodelay; proxy_pass http://valuation_svc;   include /etc/nginx/proxy_params.inc; }
    location /api/v1/documents     { limit_req zone=api_limit burst=40 nodelay; proxy_pass http://document_svc;    include /etc/nginx/proxy_params.inc; }
    location /api/v1/notifications { limit_req zone=api_limit burst=40 nodelay; proxy_pass http://notification_svc; include /etc/nginx/proxy_params.inc; }
    location /api/v1/reports       { limit_req zone=api_limit burst=40 nodelay; proxy_pass http://reporting_svc;   include /etc/nginx/proxy_params.inc; }

    # --- Frontend (Inertia / Vue) -----------------------------------------------
    location / {
        proxy_pass http://web_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"monolithe-patrimoine"}';
        add_header Content-Type application/json;
    }
}
