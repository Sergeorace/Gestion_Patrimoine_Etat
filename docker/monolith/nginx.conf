# =============================================================================
# Nginx monolithe - gateway + fastcgi vers php-fpm (pools 9001-9011)
# /api/v1/<domaine>/* -> pool php-fpm du service
# /*                  -> frontend Inertia (pool 9011) + assets statiques
# =============================================================================

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 20m;
    root /var/www/services/frontend/public;

    # --- Endpoints sensibles : rate-limit strict -------------------------------
    location ~ ^/api/v1/auth/(login|register|refresh|forgot-password|reset-password|verify) {
        limit_req zone=login_limit burst=5 nodelay;
        fastcgi_pass 127.0.0.1:9001;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/services/auth-service/public/index.php;
        fastcgi_param PATH_INFO $uri;
        fastcgi_read_timeout 30s;
    }

    # --- Auth / users / roles ---------------------------------------------------
    location /api/v1/auth/ {
        limit_req zone=api_limit burst=40 nodelay;
        fastcgi_pass 127.0.0.1:9001;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/services/auth-service/public/index.php;
        fastcgi_param PATH_INFO $uri;
    }
    location ~ ^/api/v1/(users|roles|permissions)(/|\?|$) {
        limit_req zone=api_limit burst=40 nodelay;
        fastcgi_pass 127.0.0.1:9001;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/services/auth-service/public/index.php;
        fastcgi_param PATH_INFO $uri;
    }

    # --- Organisation (alias /organisation et /org) -----------------------------
    location /api/v1/organisation/ {
        limit_req zone=api_limit burst=40 nodelay;
        rewrite ^/api/v1/organisation/(.+)$ /api/v1/$1 break;
        fastcgi_pass 127.0.0.1:9002;
        include fastcgi_params;
        fastcgi_param REQUEST_URI $uri$is_args$args;
        fastcgi_param SCRIPT_FILENAME /var/www/services/organisation-service/public/index.php;
        fastcgi_param PATH_INFO $uri;
    }
    location /api/v1/org/ {
        limit_req zone=api_limit burst=40 nodelay;
        rewrite ^/api/v1/org/(.+)$ /api/v1/$1 break;
        fastcgi_pass 127.0.0.1:9002;
        include fastcgi_params;
        fastcgi_param REQUEST_URI $uri$is_args$args;
        fastcgi_param SCRIPT_FILENAME /var/www/services/organisation-service/public/index.php;
        fastcgi_param PATH_INFO $uri;
    }

    # --- Metier -----------------------------------------------------------------
    location /api/v1/assets        { limit_req zone=api_limit burst=40 nodelay; fastcgi_pass 127.0.0.1:9003; include fastcgi_params; fastcgi_param SCRIPT_FILENAME /var/www/services/asset-service/public/index.php;       fastcgi_param PATH_INFO $uri; }
    location /api/v1/movements     { limit_req zone=api_limit burst=40 nodelay; fastcgi_pass 127.0.0.1:9004; include fastcgi_params; fastcgi_param SCRIPT_FILENAME /var/www/services/movement-service/public/index.php;    fastcgi_param PATH_INFO $uri; }
    location /api/v1/inventories   { limit_req zone=api_limit burst=40 nodelay; fastcgi_pass 127.0.0.1:9005; include fastcgi_params; fastcgi_param SCRIPT_FILENAME /var/www/services/inventory-service/public/index.php;   fastcgi_param PATH_INFO $uri; }
    location /api/v1/maintenance   { limit_req zone=api_limit burst=40 nodelay; fastcgi_pass 127.0.0.1:9006; include fastcgi_params; fastcgi_param SCRIPT_FILENAME /var/www/services/maintenance-service/public/index.php; fastcgi_param PATH_INFO $uri; }
    location /api/v1/valorisation  { limit_req zone=api_limit burst=40 nodelay; fastcgi_pass 127.0.0.1:9007; include fastcgi_params; fastcgi_param SCRIPT_FILENAME /var/www/services/valuation-service/public/index.php;   fastcgi_param PATH_INFO $uri; }
    location /api/v1/documents     { limit_req zone=api_limit burst=40 nodelay; fastcgi_pass 127.0.0.1:9008; include fastcgi_params; fastcgi_param SCRIPT_FILENAME /var/www/services/document-service/public/index.php;    fastcgi_param PATH_INFO $uri; }
    location /api/v1/notifications { limit_req zone=api_limit burst=40 nodelay; fastcgi_pass 127.0.0.1:9009; include fastcgi_params; fastcgi_param SCRIPT_FILENAME /var/www/services/notification-service/public/index.php; fastcgi_param PATH_INFO $uri; }
    location /api/v1/reports       { limit_req zone=api_limit burst=40 nodelay; fastcgi_pass 127.0.0.1:9010; include fastcgi_params; fastcgi_param SCRIPT_FILENAME /var/www/services/reporting-service/public/index.php;   fastcgi_param PATH_INFO $uri; }

    # --- Frontend : assets Vite statiques ---------------------------------------
    location /build/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* \.(ico|png|jpg|jpeg|svg|webp|woff2?|ttf|eot|map)$ {
        try_files $uri =404;
        expires 7d;
    }

    # --- Frontend (Inertia / Vue) -----------------------------------------------
    location / {
        limit_req zone=api_limit burst=40 nodelay;
        fastcgi_pass 127.0.0.1:9011;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/services/frontend/public/index.php;
        fastcgi_param PATH_INFO $uri;
        fastcgi_read_timeout 60s;
    }

    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"monolithe-patrimoine"}';
        add_header Content-Type application/json;
    }
}
