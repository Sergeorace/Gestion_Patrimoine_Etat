; =============================================================================
; Supervisord - monolithe Patrimoine
; nginx (port 80) + 11 serveurs PHP artisan (ports 3000 et 8001-8010)
; PostgreSQL et Redis sont demarres par l'entrypoint avant supervisord.
; =============================================================================

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web-app]
command=php -d memory_limit=128M /var/www/services/frontend/artisan serve --host=127.0.0.1 --port=3000
directory=/var/www/services/frontend
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:auth-service]
command=php -d memory_limit=128M /var/www/services/auth-service/artisan serve --host=127.0.0.1 --port=8001
