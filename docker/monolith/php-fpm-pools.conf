; Pools php-fpm - monolithe Patrimoine (mode ondemand : ~0 Mo au repos)
; auth=9001 organisation=9002 asset=9003 movement=9004 inventory=9005
; maintenance=9006 valuation=9007 document=9008 notification=9009
; reporting=9010 frontend=9011

[auth-service]
user = www-data
group = www-data
listen = 127.0.0.1:9001
listen.allowed_clients = 127.0.0.1
chdir = /var/www/services/auth-service
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 10s
request_terminate_timeout = 60s
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[memory_limit] = 128M

