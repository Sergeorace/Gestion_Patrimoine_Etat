# =============================================================================
# API Gateway - Nginx
# Routage /api/v1/<domaine>/* vers le micro-service correspondant.
# Verification JWT confiee aux services (cle publique partagee).
# =============================================================================

# Map des prefixes d'API vers les services internes.
# $request_uri (et non $uri) pour que les rewrite ci-dessous ne changent pas l'upstream.
map $request_uri $api_upstream {
    ~^/api/v1/auth/                             http://auth-service:8000;
    ~^/api/v1/(users|roles|permissions)(/|\?|$) http://auth-service:8000;
    ~^/api/v1/organisation/                     http://organisation-service:8000;
    ~^/api/v1/org/          http://organisation-service:8000;
    ~^/api/v1/assets        http://asset-service:8000;
    ~^/api/v1/movements     http://movement-service:8000;
    ~^/api/v1/inventories   http://inventory-service:8000;
    ~^/api/v1/maintenance   http://maintenance-service:8000;
    ~^/api/v1/valorisation  http://valuation-service:8000;
    ~^/api/v1/documents     http://document-service:8000;
    ~^/api/v1/notifications http://notification-service:8000;
    ~^/api/v1/reports       http://reporting-service:8000;
    default                 http://web-app:3000;
}

# Rate limiting : zones memoire (valeurs ajustables)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # Resolution DNS dynamique des conteneurs Docker (IPs changeantes)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Securite de base
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    client_max_body_size 20m;

    # --- API REST -> micro-services -------------------------------------------

    # Endpoints sensibles : rate-limit strict anti force-brute / abus
    location ~ ^/api/v1/auth/(login|register|refresh|forgot-password|reset-password|verify) {
        limit_req zone=login_limit burst=5 nodelay;

        rewrite ^/api/v1/[^/]+/(health|up)$ /api/v1/$1 break;
        proxy_pass http://auth-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;

        # Healthcheck par domaine : /api/v1/<domaine>/health -> /api/v1/health du service
        rewrite ^/api/v1/[^/]+/(health|up)$ /api/v1/$1 break;
        # Alias organisation : /api/v1/organisation/* et /api/v1/org/* -> routes non prefixees
        rewrite ^/api/v1/(organisation|org)/(.+)$ /api/v1/$2 break;

        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 30s;
    }

    # --- Web app (Inertia/Vue) -------------------------------------------------
    location / {
        proxy_pass http://web-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Healthcheck gateway ----------------------------------------------------
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"api-gateway"}';
        add_header Content-Type application/json;
    }
}
